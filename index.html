<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kedem Barber</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 35px;
    }

    .section {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .hours {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .hour {
      padding: 14px;
      background: #292929;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .hour:hover {
      background: #333;
    }

    .hour.selected {
      background: white;
      color: black;
    }

    .hour.disabled {
      background: #111;
      color: #555;
      border-color: #222;
      cursor: not-allowed;
    }

    button.confirm {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    button.confirm:hover {
      background: #ddd;
    }

    #mensaje {
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>KEDEM BARBER</h1>
    <p class="subtitle">Reserva tu hora</p>

    <div class="section">

      <label for="fecha">Selecciona el día</label>

      <input type="date" id="fecha">

      <label>Selecciona la hora</label>

      <div class="hours" id="horas"></div>

      <label for="nombre" style="margin-top:20px;">Tu nombre</label>

      <input type="text" id="nombre" placeholder="Ej: Juan Pérez">

      <label for="telefono">WhatsApp</label>

      <input type="tel" id="telefono" placeholder="Ej: 957166184">

      <button class="confirm" onclick="reservar()">
        Reservar hora
      </button>

      <div id="mensaje"></div>

    </div>

    <p style="color:#777; font-size:14px;">
      Lunes a sábado · 10:00 a 20:00
    </p>

  </div>

  <script>
    let horaSeleccionada = null;

    const horasDisponibles = [
      "10:00",
      "11:00",
      "12:00",
      "13:00",
      "14:00",
      "15:00",
      "16:00",
      "17:00",
      "18:00",
      "19:00"
    ];

    const fechaInput = document.getElementById("fecha");
    const horasDiv = document.getElementById("horas");

    fechaInput.addEventListener("change", mostrarHoras);

    function mostrarHoras() {

      horaSeleccionada = null;
      horasDiv.innerHTML = "";

      const fecha = new Date(fechaInput.value + "T00:00:00");
      const dia = fecha.getDay();

      // Domingo
      if (dia === 0) {
        horasDiv.innerHTML =
          "<p style='color:#aaa;'>Los domingos la barbería está cerrada.</p>";
        return;
      }

      horasDisponibles.forEach(hora => {

        const boton = document.createElement("button");

        boton.className = "hour";
        boton.textContent = hora;

        boton.onclick = function () {

          document.querySelectorAll(".hour").forEach(b => {
            b.classList.remove("selected");
          });

          boton.classList.add("selected");

          horaSeleccionada = hora;
        };

        horasDiv.appendChild(boton);

      });
    }

    function reservar() {

      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const fecha = fechaInput.value;

      if (!fecha) {
        alert("Selecciona un día.");
        return;
      }

      if (!horaSeleccionada) {
        alert("Selecciona una hora.");
        return;
      }

      if (!nombre) {
        alert("Ingresa tu nombre.");
        return;
      }

      if (!telefono) {
        alert("Ingresa tu WhatsApp.");
        return;
      }

      document.getElementById("mensaje").innerHTML =
        "✅ Reserva seleccionada:<br><br>" +
        "<strong>" + fecha + "</strong><br>" +
        "<strong>" + horaSeleccionada + "</strong><br>" +
        nombre + "<br>" +
        telefono;
    }
  </script>

</body>
</html>
<script type="module">

  import { initializeApp } 
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import { 
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  // Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDbBz1Eoz1d5OkdKEShxGD1YU4ZSzZ6sLE",
    authDomain: "kedem-barber.firebaseapp.com",
    projectId: "kedem-barber",
    storageBucket: "kedem-barber.firebasestorage.app",
    messagingSenderId: "12637220504",
    appId: "1:12637220504:web:b8002443bf95ff238eeaed"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  let horaSeleccionada = null;


  const horasDisponibles = [
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00",
    "19:00"
  ];


  const fechaInput = document.getElementById("fecha");
  const horasDiv = document.getElementById("horas");


  fechaInput.addEventListener("change", mostrarHoras);


  async function mostrarHoras() {

    horaSeleccionada = null;
    horasDiv.innerHTML = "";

    const fecha = new Date(fechaInput.value + "T00:00:00");
    const dia = fecha.getDay();

    // Domingo
    if (dia === 0) {
      horasDiv.innerHTML =
        "<p style='color:#aaa;'>Los domingos la barbería está cerrada.</p>";
      return;
    }


    // Buscar reservas de ese día
    const reservasRef = collection(db, "Reservas");

    const q = query(
      reservasRef,
      where("fecha", "==", fechaInput.value)
    );

    const resultado = await getDocs(q);

    const horasOcupadas = [];

    resultado.forEach((doc) => {
      horasOcupadas.push(doc.data().hora);
    });


    horasDisponibles.forEach(hora => {

      const boton = document.createElement("button");

      boton.type = "button";
      boton.className = "hour";
      boton.textContent = hora;


      // Si está ocupada
      if (horasOcupadas.includes(hora)) {

        boton.classList.add("disabled");
        boton.disabled = true;
        boton.textContent = hora + " · Ocupada";

      } else {

        boton.onclick = function () {

          document.querySelectorAll(".hour").forEach(b => {
            b.classList.remove("selected");
          });

          boton.classList.add("selected");

          horaSeleccionada = hora;
        };

      }

      horasDiv.appendChild(boton);

    });

  }


  async function reservar() {

    const nombre =
      document.getElementById("nombre").value.trim();

    const telefono =
      document.getElementById("telefono").value.trim();

    const fecha =
      fechaInput.value;


    if (!fecha) {
      alert("Selecciona un día.");
      return;
    }


    if (!horaSeleccionada) {
      alert("Selecciona una hora.");
      return;
    }


    if (!nombre) {
      alert("Ingresa tu nombre.");
      return;
    }


    if (!telefono) {
      alert("Ingresa tu WhatsApp.");
      return;
    }


    try {

      // Guardar reserva en Firebase

      await addDoc(collection(db, "Reservas"), {

        nombre: nombre,
        telefono: telefono,
        fecha: fecha,
        hora: horaSeleccionada

      });


      document.getElementById("mensaje").innerHTML =

        "✅ <strong>Reserva confirmada</strong><br><br>" +

        nombre + "<br>" +

        fecha + " · " +

        horaSeleccionada;


      // Limpiar formulario

      document.getElementById("nombre").value = "";
      document.getElementById("telefono").value = "";

      horaSeleccionada = null;

      mostrarHoras();


    } catch (error) {

      console.error(error);

      document.getElementById("mensaje").innerHTML =
        "❌ No se pudo realizar la reserva. Inténtalo nuevamente.";

    }

  }

</script>
