
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kedem Barber | Reserva tu hora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 35px 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      background: #1c1c1c;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      color: #ccc;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 22px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
    }

    .hours {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .hour {
      padding: 14px 5px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #292929;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .hour.selected {
      background: white;
      color: black;
    }

    .hour:disabled {
      color: #888;
      background: #151515;
      cursor: not-allowed;
      border-color: #333;
    }

    .confirm {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm:disabled {
      opacity: .5;
      cursor: wait;
    }

    #mensaje {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer {
      color: #888;
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>KEDEM BARBER</h1>
    <p class="subtitle">Reserva tu hora</p>

    <section class="section">
      <label for="fecha">Selecciona el día</label>
      <input type="date" id="fecha" required>

      <label>Selecciona la hora</label>
      <div class="hours" id="horas">
        <p style="color:#aaa">Selecciona una fecha para ver los horarios.</p>
      </div>

      <div style="margin-top:22px">
        <label for="nombre">Tu nombre</label>
        <input id="nombre" type="text" maxlength="80"
               placeholder="Ej: Juan Pérez" autocomplete="name">

        <label for="telefono">WhatsApp</label>
        <input id="telefono" type="tel" maxlength="20"
               placeholder="Ej: 957166184" autocomplete="tel">

        <button class="confirm" id="confirmar" type="button">
          Reservar hora
        </button>

        <div id="mensaje" role="status" aria-live="polite"></div>
      </div>
    </section>

    <p class="footer">
      Lunes a sábado · 10:00 a 20:00<br>
      Domingos cerrado
    </p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore, collection, doc, getDocs,
      query, where, writeBatch
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbBz1Eoz1d5OkdKEShxGD1YU4ZSzZ6sLE",
      authDomain: "kedem-barber.firebaseapp.com",
      projectId: "kedem-barber",
      storageBucket: "kedem-barber.firebasestorage.app",
      messagingSenderId: "12637220504",
      appId: "1:12637220504:web:b8002443bf95ff238eeaed"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fechaInput = document.getElementById("fecha");
    const horasDiv = document.getElementById("horas");
    const mensaje = document.getElementById("mensaje");
    const confirmar = document.getElementById("confirmar");

    const horasDisponibles = [
      "10:00", "11:00", "12:00", "13:00", "14:00",
      "15:00", "16:00", "17:00", "18:00", "19:00"
    ];

    let horaSeleccionada = null;
    let cargando = false;

    function fechaLocalActual() {
      const ahora = new Date();
      const anio = ahora.getFullYear();
      const mes = String(ahora.getMonth() + 1).padStart(2, "0");
      const dia = String(ahora.getDate()).padStart(2, "0");
      return `${anio}-${mes}-${dia}`;
    }

    fechaInput.min = fechaLocalActual();

    function idBloque(fecha, hora) {
      return fecha.replaceAll("-", "") + "_" + hora.replace(":", "");
    }

    function mostrarMensaje(texto) {
      mensaje.textContent = texto;
    }

    async function mostrarHoras() {
      horaSeleccionada = null;
      horasDiv.replaceChildren();
      mostrarMensaje("");

      const fecha = fechaInput.value;
      if (!fecha) {
        horasDiv.textContent = "Selecciona una fecha.";
        return;
      }

      if (fecha < fechaLocalActual()) {
        horasDiv.textContent = "Elige hoy o una fecha futura.";
        return;
      }

      // Interpretar la fecha seleccionada sin cambiar de zona horaria.
      const [anio, mes, dia] = fecha.split("-").map(Number);
      const diaSemana = new Date(anio, mes - 1, dia).getDay();

      if (diaSemana === 0) {
        horasDiv.textContent = "Los domingos la barbería está cerrada.";
        return;
      }

      horasDiv.textContent = "Consultando horarios...";

      try {
        const q = query(
          collection(db, "Ocupadas"),
          where("fecha", "==", fecha)
        );
        const resultado = await getDocs(q);
        const ocupadas = new Set(
          resultado.docs.map(documento => documento.data().hora)
        );

        // Evitar mostrar resultados de una fecha anterior si el usuario
        // cambia de fecha mientras se está consultando Firebase.
        if (fechaInput.value !== fecha) return;

        horasDiv.replaceChildren();

        for (const hora of horasDisponibles) {
          const boton = document.createElement("button");
          boton.type = "button";
          boton.className = "hour";
          boton.textContent = ocupadas.has(hora)
            ? `${hora} · Ocupada`
            : hora;

          boton.disabled = ocupadas.has(hora);

          boton.addEventListener("click", () => {
            horaSeleccionada = hora;

            horasDiv.querySelectorAll(".hour").forEach(b => {
              b.classList.remove("selected");
            });

            boton.classList.add("selected");
            mostrarMensaje(`Horario seleccionado: ${hora}`);
          });

          horasDiv.appendChild(boton);
        }
      } catch (error) {
        console.error(error);
        horasDiv.textContent = "No se pudieron consultar los horarios.";
      }
    }

    fechaInput.addEventListener("change", mostrarHoras);

    confirmar.addEventListener("click", async () => {
      if (cargando) return;

      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const fecha = fechaInput.value;
      const hora = horaSeleccionada;

      if (!fecha) return mostrarMensaje("Selecciona un día.");
      if (!hora) return mostrarMensaje("Selecciona una hora.");
      if (!nombre) return mostrarMensaje("Escribe tu nombre.");
      if (!telefono) return mostrarMensaje("Escribe tu WhatsApp.");

      if (fecha < fechaLocalActual()) {
        return mostrarMensaje("Elige hoy o una fecha futura.");
      }

      cargando = true;
      confirmar.disabled = true;
      mostrarMensaje("Procesando la reserva...");

      try {
        const reservaRef = doc(collection(db, "Reservas"));
        const bloqueId = idBloque(fecha, hora);
        const ocupadaRef = doc(db, "Ocupadas", bloqueId);

        // Las reglas de Firestore deben validar ambos documentos
        // dentro de esta operación atómica.
        const batch = writeBatch(db);

        batch.set(ocupadaRef, {
          fecha,
          hora,
          reservaId: reservaRef.id
        });

        batch.set(reservaRef, {
          nombre,
          telefono,
          fecha,
          hora,
          slotId: bloqueId
        });

        await batch.commit();

        mostrarMensaje(
          `¡Reserva confirmada, ${nombre}! ${fecha} a las ${hora}.`
        );

        document.getElementById("nombre").value = "";
        document.getElementById("telefono").value = "";
        horaSeleccionada = null;

        await mostrarHoras();
      } catch (error) {
        console.error(error);
        mostrarMensaje(
          "No se pudo confirmar la reserva. Puede que el horario ya esté ocupado o que falte configurar los permisos."
        );
        await mostrarHoras();
      } finally {
        cargando = false;
        confirmar.disabled = false;
      }
    });
  </script>
</body>
</html>
